# Spark Defaults for F1 Lakehouse Streaming
# Iceberg + MinIO (S3) + Kafka configuration

spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse_catalog             org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse_catalog.type        hive
spark.sql.catalog.lakehouse_catalog.uri         thrift://hive-metastore:9083
spark.sql.catalog.lakehouse_catalog.warehouse   s3a://warehouse
spark.sql.catalog.lakehouse_catalog.io-impl     org.apache.iceberg.aws.s3.S3FileIO

# S3/MinIO access
spark.hadoop.fs.s3a.endpoint                    http://minio:9000
spark.hadoop.fs.s3a.access.key                  minioadmin
spark.hadoop.fs.s3a.secret.key                  minioadmin
spark.hadoop.fs.s3a.path.style.access           true
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem

# Performance tuning
spark.sql.shuffle.partitions                    4
spark.sql.adaptive.enabled                      true
spark.serializer                                org.apache.spark.serializer.KryoSerializer
