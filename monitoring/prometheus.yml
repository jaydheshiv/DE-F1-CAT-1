global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "f1-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"

  - job_name: "f1-spark-streaming"
    static_configs:
      - targets: ["spark-iceberg:4040"]
    metrics_path: "/metrics/prometheus"

  - job_name: "f1-airflow"
    static_configs:
      - targets: ["airflow-webserver:8080"]
    metrics_path: "/metrics"
